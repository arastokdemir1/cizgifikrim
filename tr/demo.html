<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yönlendiriliyorsunuz — CizgiFikrim</title>
  <meta http-equiv="refresh" content="0; url=../demo/e-ticaret/terk-edilmis-sepet/">
  <link rel="canonical" href="https://cizgifikrim.net/demo/e-ticaret/terk-edilmis-sepet/">
  <link rel="stylesheet" href="../assets/css/main.css?v=66">
  <link rel="icon" href="/assets/favicon.svg?v=4" type="image/svg+xml">
  <script>
    (function() {
      var q = new URLSearchParams(window.location.search), m = (q.get('mode') || '').toLowerCase();
      var dir = ['sales', 'growth', '2', 'mode_2'].indexOf(m) >= 0 ? 'satis-asistani' : (['vip', 'scale', '3', 'mode_3'].indexOf(m) >= 0 ? 'musteri-sadakati' : 'terk-edilmis-sepet');
      window.location.replace('/demo/e-ticaret/' + dir + '/');
    })();
  </script>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      font-family: var(--sans, -apple-system, BlinkMacSystemFont, "Inter", sans-serif);
      background: var(--bg, #fbfbfd);
      color: var(--ink, #0f172a);
      text-align: center;
      padding: 1.5rem;
    }
    .redirect-card {
      background: #ffffff;
      padding: 2.5rem 2rem;
      border-radius: 1.25rem;
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
      max-width: 480px;
      width: 100%;
    }
    .redirect-card h1 {
      font-size: 1.35rem;
      margin-bottom: 0.75rem;
      font-weight: 700;
    }
    .redirect-card p {
      color: #64748b;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .redirect-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #0066ff;
      color: #ffffff;
      padding: 0.75rem 1.4rem;
      border-radius: 0.75rem;
      font-weight: 600;
      text-decoration: none;
      font-size: 0.95rem;
      transition: background 0.2s;
    }
    .redirect-btn:hover {
      background: #0052cc;
    }
  </style>
</head>
<body>
  <div class="redirect-card">
    <h1>Yönlendiriliyorsunuz…</h1>
    <p>E-ticaret WhatsApp prototipleri artık Projeler sayfamızda yer almaktadır.</p>
    <a href="projeler.html#e-ticaret" class="redirect-btn" id="redirect-link">
      <span>Projelere Git</span> <span aria-hidden="true">➔</span>
    </a>
  </div>
  <script>
    var link = document.getElementById('redirect-link');
    if (link && window.location.search) {
      link.href = 'projeler.html' + window.location.search + '#e-ticaret';
    }
  </script>
</body>
</html>
