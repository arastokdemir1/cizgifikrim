<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-2+65pgsSL6OlzkHjwNAExOhQ3dEtHTmrA9j8XtI1WZE='; style-src 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vesira interactive demo</title>
<meta name="description" content="Interactive demo of the Vesira interface with sample images.">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f6f2ea">
<style>
/* Vesira demo: ürünün kendi arayüzü (site paletine boyanmaz). Ağ çağrısı yok, yalnız örnek görseller. */
@font-face { font-family: 'Fraunces'; font-style: normal; font-weight: 400 700; font-display: swap; src: url(fonts/fraunces.woff2) format('woff2'); }
@font-face { font-family: 'Fraunces'; font-style: italic; font-weight: 400 700; font-display: swap; src: url(fonts/fraunces-i.woff2) format('woff2'); }
@font-face { font-family: 'Figtree'; font-style: normal; font-weight: 400 700; font-display: swap; src: url(fonts/figtree.woff2) format('woff2'); }
:root {
  --paper: #f6f2ea; --paper-2: #eee7da; --surface: #fffdf9; --surface-2: #faf6ef;
  --ink: #231c17; --muted: #6b6155; --line: #e4dccd; --line-2: #d2c6b2;
  --brand: #b4492a; --brand-text: #a23f1f; --second: #e19a54; --tint: #f6e5d8;
  --grad: linear-gradient(100deg, #a63f22, #c85d34 52%, #e19a54); --grad-off: #e6dccd;
  --r-card: 20px; --r-in: 14px; --r-field: 12px; --r-btn: 16px; --r-img: 8px;
  --ease: cubic-bezier(0.32, 0.72, 0, 1);
  --serif: 'Fraunces', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
  --sans: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
body { overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
h1, h2, h3, p { margin: 0; }
img { display: block; max-width: 100%; }

.app { position: relative; height: 100%; max-width: 440px; margin: 0 auto; background: var(--paper); overflow: hidden; overflow: clip; display: flex; flex-direction: column; }
@media (min-width: 700px) { body:not(.framed) { background: #dfd8c9; } body:not(.framed) .app { box-shadow: 0 0 0 1px rgba(0,0,0,.06), 0 30px 80px rgba(0,0,0,.18); } }

.status { flex: none; height: 44px; padding: 0 22px 0 26px; display: flex; align-items: center; justify-content: space-between; font-weight: 600; font-size: 15px; background: var(--paper); }
.status .r { display: flex; gap: 6px; align-items: center; }
.badge-row { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 16px 6px; background: var(--paper); border-bottom: 1px solid var(--line); }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--tint); color: var(--brand-text); font-size: 11px; font-weight: 600; letter-spacing: .02em; }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--brand); }
.reset { font-size: 12px; font-weight: 600; color: var(--muted); padding: 8px 4px; min-height: 32px; }
.reset:hover { color: var(--brand-text); }

main { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
main::-webkit-scrollbar { display: none; }
.scr { padding: 14px 18px 24px; }

/* tipografi */
.serif { font-family: var(--serif); }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--brand-text); }
.credit-chip { font-size: 14px; color: var(--muted); font-weight: 500; }
.h-big { font-family: var(--serif); font-weight: 500; font-size: 40px; line-height: 1.05; letter-spacing: -.02em; }
.h-big .dot { color: var(--brand); }
.sub { margin-top: 10px; font-size: 16px; color: var(--muted); }
.muted { color: var(--muted); }

/* butonlar */
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 52px; padding: 0 18px; border-radius: var(--r-btn); font-size: 16px; font-weight: 600; text-align: center; transition: transform .2s var(--ease), filter .2s; }
.btn:active { transform: scale(.985); }
.btn.primary { background: var(--grad); color: #fff; box-shadow: 0 10px 22px -12px rgba(166,63,34,.65); }
.btn.primary:hover { filter: brightness(1.04); }
.btn.primary[disabled], .btn.primary[aria-disabled="true"] { background: var(--grad-off); color: #5f564a; box-shadow: none; }
.btn.ghost { background: var(--surface); border: 1.5px solid var(--line-2); color: var(--ink); }
.btn.ghost[aria-disabled="true"] { opacity: .5; }
.btn.sm { width: auto; min-height: 44px; padding: 0 16px; font-size: 15px; }
.circle { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); display: grid; place-items: center; color: var(--ink); }
.circle svg { width: 18px; height: 18px; }

.card { background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--r-card); }
.stats3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 22px; }
.stat { padding: 14px 12px; }
.stat .k { font-size: 13px; color: var(--muted); }
.stat .v { font-family: var(--serif); font-size: 30px; line-height: 1.15; margin: 2px 0; }
.stat .u { font-size: 13px; color: var(--muted); }
.credits-card { margin-top: 20px; padding: 16px; }
.credits-card .top { display: flex; justify-content: space-between; align-items: baseline; }
.credits-card h3 { font-family: var(--serif); font-size: 19px; font-weight: 600; }
.credits-card .lnk { font-size: 14px; font-weight: 600; color: var(--brand-text); padding: 6px 2px; min-height: 32px; }
.credits-card .big { margin-top: 14px; font-family: var(--serif); font-size: 42px; line-height: 1; }
.credits-card .big small { font: 400 15px var(--sans); color: var(--muted); margin-left: 6px; }
.bar { margin-top: 14px; height: 10px; border-radius: 99px; background: var(--paper-2); overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; background: var(--brand); border-radius: 99px; }
.legend { display: flex; gap: 18px; margin-top: 12px; font-size: 13px; color: var(--muted); }
.legend b { color: var(--ink); margin-left: 4px; }
.legend span::before { content: ""; display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: var(--brand); }
.legend span + span::before { background: var(--second); }
.arches { display: flex; gap: 5px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.arches i { width: 14px; height: 18px; border-radius: 7px 7px 2px 2px; background: var(--brand); }
.credits-card .note { margin-top: 10px; font-size: 13px; color: var(--muted); }
.credits-card .note b { color: var(--ink); }

/* tab çubuğu */
.tabbar { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px 6px 18px; background: rgba(246,242,234,.94); border-top: 1px solid var(--line); }
.tabbar button { display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 48px; padding: 6px 2px; font-size: 11px; font-weight: 600; color: #9a8f80; }
.tabbar button svg { width: 24px; height: 24px; }
.tabbar button[aria-current="page"] { color: var(--brand); }

/* sayfa üst çubuğu (sonuç, sheet) */
.topbar { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 8px; padding: 6px 0 10px; }
.logo { display: flex; justify-content: center; align-items: center; gap: 6px; font-family: var(--serif); font-size: 21px; font-weight: 600; }
.logo svg { width: 24px; height: 24px; }

/* sheet katmanları */
.layer { position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; background: var(--paper); animation: slide .38s var(--ease) both; }
.layer.dim { top: 60px; border-radius: 22px 22px 0 0; box-shadow: 0 -12px 40px rgba(0,0,0,.25); }
.layer .grab { flex: none; width: 44px; height: 5px; border-radius: 3px; background: var(--line-2); margin: 8px auto 2px; }
.layer .body { flex: 1; min-height: 0; overflow-y: auto; padding: 0 18px 16px; scrollbar-width: none; }
.layer .body::-webkit-scrollbar { display: none; }
.layer .foot { flex: none; padding: 10px 18px 22px; background: linear-gradient(to top, var(--paper) 78%, rgba(246,242,234,0)); text-align: center; }
.layer .foot .fine { margin-top: 8px; font-size: 12px; color: var(--muted); }
@keyframes slide { from { transform: translateY(100%); } to { transform: none; } }
.backdrop { position: absolute; inset: 0; z-index: 19; background: rgba(35,28,23,.45); }

/* New room */
.step { display: flex; align-items: baseline; gap: 12px; margin: 20px 0 10px; }
.step i { font-family: var(--serif); font-style: normal; font-size: 40px; line-height: .9; color: var(--brand); width: 24px; }
.step h2 { font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
.step small { font-size: 14px; color: var(--muted); font-weight: 400; margin-left: 6px; }
.help { margin: -2px 0 10px 36px; font-size: 13px; color: var(--muted); }
.rooms-pick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-left: 36px; }
.pick { display: flex; flex-direction: column; gap: 6px; text-align: left; border: 2px solid transparent; border-radius: 12px; padding: 4px; }
.pick img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; background: var(--paper-2); }
.pick span { font-size: 12px; font-weight: 600; padding: 0 2px 2px; }
.pick[aria-checked="true"] { border-color: var(--brand); background: var(--surface); }
.err { margin: 10px 0 0 36px; font-size: 13px; font-weight: 600; color: #a2331c; }
.levels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-left: 28px; align-items: stretch; }
.level { display: flex; flex-direction: column; gap: 6px; text-align: left; padding: 6px 6px 10px; border: 2px solid transparent; border-radius: var(--r-card); }
.level img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; background: var(--paper-2); }
.level h3 { font-family: var(--serif); font-size: 16px; line-height: 1.15; font-weight: 600; }
.level .rec { font-size: 12px; font-weight: 600; color: var(--brand-text); margin-top: -2px; }
.level p { font-size: 12px; color: var(--muted); flex: 1; }
.level b { font-size: 13px; }
.level[aria-checked="true"] { border-color: var(--brand); background: var(--surface); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-left: 36px; }
.chip { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 16px; border: 1.5px solid var(--line-2); border-radius: 999px; font-size: 15px; }
.chip .sw { display: inline-flex; }
.chip .sw i { width: 18px; height: 18px; border-radius: 50%; margin-left: -6px; border: 1.5px solid var(--paper); }
.chip .sw i:first-child { margin-left: 0; }
.chip[aria-pressed="true"] { background: var(--tint); border-color: var(--brand); color: var(--brand-text); }
textarea.note { width: calc(100% - 36px); margin-left: 36px; min-height: 92px; padding: 12px; font: inherit; font-size: 15px; background: var(--surface); border: 1.5px solid var(--line-2); border-radius: var(--r-field); resize: none; color: var(--ink); }
textarea.note::placeholder { color: #9a8f80; }

/* Designing */
.designing { position: relative; margin: 6px 18px 0; border-radius: var(--r-img); overflow: hidden; background: var(--paper-2); }
.designing img { width: 100%; height: 100%; object-fit: cover; }
.veil { position: absolute; inset: 0; background: rgba(246,242,234,.72); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.veil::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 20%, rgba(255,253,249,.7) 50%, transparent 80%); transform: translateX(-100%); animation: sweep 1.5s var(--ease) infinite; }
@keyframes sweep { to { transform: translateX(100%); } }
.dtxt { padding: 20px 20px; text-align: center; font-size: 15px; color: var(--muted); }
.prog { width: 56%; height: 4px; margin: 18px auto 0; border-radius: 99px; background: var(--paper-2); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--grad); border-radius: 99px; transform-origin: 0 50%; animation: fillbar 2.6s cubic-bezier(.25,.6,.3,1) forwards; }
@keyframes fillbar { from { transform: scaleX(.04); } to { transform: scaleX(.96); } }
@media (prefers-reduced-motion: reduce) { .prog i { transform: scaleX(.5); } }
.dtxt em { font-family: var(--serif); font-size: 26px; color: var(--ink); display: block; margin-bottom: 4px; }

/* Result */
.res-title { font-family: var(--serif); font-weight: 500; font-size: 38px; line-height: 1.05; letter-spacing: -.02em; }
.res-meta { margin-top: 6px; font-family: var(--serif); font-style: italic; font-size: 19px; color: var(--muted); }
.menu-dots { width: 40px; height: 40px; display: grid; place-items: center; color: var(--ink); }
.tabs { display: flex; gap: 22px; margin: 16px 0 14px; overflow-x: auto; scrollbar-width: none; }
.tabs button { padding: 8px 0; min-height: 40px; font-size: 16px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--brand); }
.sum h2 { font-family: var(--serif); font-size: 21px; font-weight: 500; line-height: 1.2; margin-bottom: 6px; }
.sum p { font-family: var(--serif); font-style: italic; font-size: 15.5px; color: var(--muted); line-height: 1.4; }
.limit { margin: 8px 0 12px; font-size: 13px; color: var(--muted); }
.ba { --p: 50%; position: relative; border-radius: var(--r-img); overflow: hidden; background: var(--paper-2); touch-action: pan-y; user-select: none; }
.ba img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.ba .before { clip-path: inset(0 calc(100% - var(--p)) 0 0); }
.ba .line { position: absolute; top: 0; bottom: 0; left: var(--p); width: 2px; margin-left: -1px; background: rgba(255,255,255,.95); pointer-events: none; }
.ba .knob { position: absolute; top: 50%; left: var(--p); width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: rgba(60,52,46,.78); border: 1.5px solid rgba(255,255,255,.9); color: #fff; display: grid; place-items: center; pointer-events: none; }
.ba .knob svg { width: 20px; height: 20px; }
.ba .tg { position: absolute; bottom: 10px; font-family: var(--serif); font-style: italic; font-size: 22px; color: #fff; text-shadow: 0 1px 8px rgba(0,0,0,.6); pointer-events: none; }
.ba .tg.l { left: 14px; } .ba .tg.r { right: 14px; }
.ba input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: ew-resize; }
.ba:focus-within .knob { outline: 2px solid var(--brand); outline-offset: 2px; }
.xf img { opacity: 0; transition: opacity .35s var(--ease); }
.xf[data-s="after"] img.after, .xf[data-s="before"] img.before { opacity: 1; }
.xf .before { clip-path: none; }
.xf-seg { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: inline-flex; padding: 3px; border-radius: 999px; background: rgba(35,28,23,.72); z-index: 2; }
.xf-seg button { min-height: 44px; min-width: 76px; padding: 0 16px; border-radius: 999px; color: #fff; font-family: var(--serif); font-style: italic; font-size: 20px; line-height: 1; }
.xf-seg button[aria-pressed="true"] { background: rgba(255,253,249,.94); color: var(--ink); }
.xf-seg button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.cmp { display: block; margin: 10px auto 14px; font-size: 14px; font-weight: 600; color: var(--brand-text); min-height: 40px; }
.acts { display: grid; gap: 10px; margin-top: 4px; }
.acts .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rate { display: flex; align-items: center; gap: 4px; margin-top: 12px; min-height: 44px; }
.rate button { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; color: var(--muted); }
.rate button svg { width: 22px; height: 22px; }
.rate button[aria-pressed="true"] { color: var(--brand); background: var(--tint); }
.rate .msg { font-size: 13px; color: var(--muted); margin-left: 6px; }
.full { position: absolute; inset: 0; z-index: 30; background: #17120f; display: flex; flex-direction: column; justify-content: center; padding: 16px; animation: fade .25s ease both; }
.full .x { position: absolute; top: 12px; right: 12px; z-index: 2; min-height: 44px; padding: 0 18px; border-radius: 999px; background: rgba(255,255,255,.14); color: #fff; font-weight: 600; font-size: 15px; }
@keyframes fade { from { opacity: 0; } }

/* Refine */
.ref-h { font-family: var(--serif); font-weight: 600; font-size: 34px; line-height: 1.05; letter-spacing: -.02em; padding-right: 8px; }
.ref-sub { margin-top: 8px; font-size: 13px; color: var(--muted); }
.ref-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding-top: 10px; }
.row-opt { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 56px; padding: 0 2px; border-bottom: 1px solid var(--line); font-size: 17px; text-align: left; }
.row-opt .o { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--line-2); display: grid; place-items: center; color: #fff; }
.row-opt .o svg { width: 14px; height: 14px; opacity: 0; }
.row-opt[aria-pressed="true"] .o { background: var(--brand); border-color: var(--brand); }
.row-opt[aria-pressed="true"] .o svg { opacity: 1; }
.row-opt[disabled] { opacity: .45; }
.grp { margin: 24px 0 4px; font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
input.own { width: 100%; min-height: 48px; margin-top: 8px; padding: 0 12px; font: inherit; font-size: 15px; background: var(--surface); border: 1.5px solid var(--line-2); border-radius: var(--r-field); color: var(--ink); }
.own-l { margin-top: 18px; font-size: 14px; font-weight: 600; }

/* Your rooms */
.rooms-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.rooms-h h1 { font-family: var(--serif); font-weight: 500; font-size: 36px; letter-spacing: -.02em; }
.rooms-h .btn { width: auto; flex: none; min-height: 46px; padding: 0 16px; font-size: 15px; white-space: nowrap; }
.room-big, .room-sm { display: block; width: 100%; text-align: left; }
.room-big { margin-top: 18px; }
.room-big .im { aspect-ratio: 3 / 2; border-radius: var(--r-img); overflow: hidden; background: var(--paper-2); }
.room-big img, .room-sm img { width: 100%; height: 100%; object-fit: cover; }
.room-big .t { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 10px; margin-top: 10px; }
.room-big h3 { font-family: var(--serif); font-size: 28px; font-weight: 500; letter-spacing: -.01em; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.room-big .m, .room-sm .m { font-size: 13px; color: var(--muted); white-space: nowrap; }
.room-sm .m { display: block; overflow: hidden; text-overflow: ellipsis; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; }
.room-sm .im { aspect-ratio: 4 / 5; border-radius: var(--r-img); overflow: hidden; background: var(--paper-2); }
.room-sm h3 { font-family: var(--serif); font-size: 22px; font-weight: 500; margin-top: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 380px) { .room-sm h3 { font-size: 20px; } .room-big h3 { font-size: 26px; } }
.empty { margin-top: 40px; text-align: center; color: var(--muted); }

/* Design profile */
.prof { padding: 16px; margin-top: 8px; }
.prof .hd { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.prof h3 { font-family: var(--serif); font-size: 21px; font-weight: 600; }
.toggle { position: relative; width: 52px; height: 32px; border-radius: 99px; background: var(--brand); flex: none; }
.toggle[aria-checked="false"] { background: var(--line-2); }
.toggle::after { content: ""; position: absolute; top: 3px; left: 23px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: transform .25s var(--ease); }
.toggle[aria-checked="false"]::after { transform: translateX(-20px); }
.prof h4 { margin: 18px 0 6px; font-size: 14px; font-weight: 600; }
.prof ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.prof li { padding: 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-in); font-size: 14px; }
.prof .ft { margin-top: 14px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted); }
.prof .ft button { font-weight: 600; color: var(--brand-text); min-height: 40px; padding: 0 8px; }
.prof .priv { margin-top: 8px; font-size: 12px; color: var(--muted); }

.toast { position: absolute; left: 50%; bottom: 96px; z-index: 40; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; padding: 10px 16px; border-radius: 999px; background: rgba(35,28,23,.92); color: #fff; font-size: 13px; font-weight: 600; transition: opacity .25s, transform .3s var(--ease); white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
[hidden] { display: none !important; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .veil::after { display: none; }
}
@media (max-width: 380px) { .rooms-h h1 { font-size: 30px; } }
@media (max-width: 340px) { .h-big { font-size: 34px; } .levels { margin-left: 0; } .rooms-pick, .chips, .help, .err, textarea.note { margin-left: 0; } textarea.note { width: 100%; } .step i { width: 18px; font-size: 32px; } }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="status" aria-hidden="true">
    <span>9:41</span>
    <span class="r">
      <svg width="19" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x=".5" y=".5" width="23" height="12" rx="3.8" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2.5" fill="currentColor"/><rect x="24.5" y="4.2" width="1.5" height="4.6" rx=".8" fill="currentColor" opacity=".4"/></svg>
    </span>
  </div>
  <div class="badge-row"><span class="badge">Interactive demo · sample images</span><button type="button" class="reset" id="reset">Reset</button></div>
  <main id="view" aria-live="polite"></main>
  <nav class="tabbar" aria-label="Tabs" id="tabs"></nav>
  <div id="layers"></div>
  <div class="toast" id="toast" role="status"></div>
</div>

<script>
(() => {
  'use strict';
  /* ── Veri (örnek). Gerçek AI çağrısı yok; sonuçlar önceden hazırlanmış örnek görseller. ── */
  const ROOMS = {
    salon:   { name: 'Living room', w: 1000, h: 667, op: '32% 50%', big: '3 / 2', def: 'yenileme' },
    mutfak:  { name: 'Kitchen',     w: 900, h: 1350, op: '50% 42%', big: '4 / 5', def: 'yenileme' },
    yatak:   { name: 'Bedroom',     w: 900, h: 1350, op: '50% 45%', big: '4 / 5', def: 'bastan-tasarim' },
    koridor: { name: 'Hallway',     w: 1000, h: 667, op: '45% 50%', big: '3 / 2', def: 'yenileme' },
  };
  const LEVELS = [
    { id: 'hafif-tazeleme', name: 'Light touch',   desc: 'Your furniture stays; textiles, art, plants.', cost: 1 },
    { id: 'yenileme',       name: 'Refresh',       desc: 'Color, lighting and a few new pieces.', cost: 2 },
    { id: 'bastan-tasarim', name: 'Full redesign', desc: 'Walls and windows stay; everything inside is new.', cost: 4 },
  ];
  const lv = (id) => LEVELS.find((l) => l.id === id);
  // Salon ve koridorda Full redesign görseli 'önce' ile aynı kamera açısında değil, mutfakta pencere/panjur kayıyor:
  // kaydırıcı yerine çapraz geçiş kullanılır (kusurlu bölge hiç görünmez).
  const aligned = (key, level) => !((key === 'salon' || key === 'koridor' || key === 'mutfak') && level === 'bastan-tasarim');
  const CHIPS = [
    { id: 'auto',  name: 'Leave it to us' },
    { id: 'light', name: 'Light and neutral', sw: ['#f4f1ec', '#e3ddd3', '#c9c1b4'] },
    { id: 'warm',  name: 'Warm earth tones',  sw: ['#e9d9c4', '#c08a5b', '#7a4e32'] },
    { id: 'cool',  name: 'Cool and calm',     sw: ['#e6ecef', '#a9bcc6', '#5d7684'] },
    { id: 'green', name: 'Natural greens',    sw: ['#e7eadf', '#a8b293', '#5c6b4c'] },
    { id: 'dark',  name: 'Dark and deep',     sw: ['#3a3f44', '#5b4a3f', '#1f2a2e'] },
    { id: 'vivid', name: 'Vivid accents',     sw: ['#f2e6d8', '#d9583b', '#2f6f8f'] },
  ];
  const REF_MAIN = ['Brighter', 'Warmer tones', 'Simpler', 'Keep my furniture exactly', 'Restore the structure', 'Bolder changes'];
  const REF_OTHER = ['Cooler tones', 'A little fuller', 'Lighter walls', 'Darker walls', 'Lighter floor', 'Darker floor', 'Add plants', 'Change the curtains', 'Fewer changes'];
  const SUMMARY = {
    'salon:hafif-tazeleme':   { head: 'Cozier living room', text: 'Warm cushions, a throw and a large abstract canvas were added. A floor lamp and a table lamp bring in warm light; the sofa and layout stay.' },
    'salon:yenileme':         { head: 'Sage and terracotta living room', text: 'The wall behind the sofa is now sage green, and a lighter sofa carries terracotta cushions. A wooden coffee table, a woven rug and a sculptural pendant replace the old pieces.' },
    'salon:bastan-tasarim':   { head: 'Calm, modern living room', text: 'A cream modular sofa, a stone-look feature wall behind the TV and a window seat. Floating oak units and a globe pendant complete the new layout.' },
    'koridor:hafif-tazeleme': { head: 'Welcoming hallway', text: 'A bench, a hook rail with a shelf, a tall mirror and a green runner were added. A floor lamp and a plant make the entry feel warmer.' },
    'koridor:yenileme':       { head: 'Warm gallery hallway', text: 'One wall is now warm taupe, with a walnut shoe cabinet and a deep red runner. Track lights, a wall sconce and framed art replace the plain look.' },
    'koridor:bastan-tasarim': { head: 'Navy and terracotta entry', text: 'Navy built-in storage with a cushioned bench, a terracotta front door and a navy runner. A slim console, sconces and bold art finish the entry.' },
    'mutfak:hafif-tazeleme':  { head: 'Brighter small kitchen', text: 'A linen Roman blind, a trailing plant, a table lamp and a burgundy runner. The cabinets and appliances stay as they are.' },
    'mutfak:yenileme':        { head: 'Olive green kitchen', text: 'The lower cabinets are now olive green, with under-cabinet lighting and a stainless steel fridge. Terracotta chairs and a striped runner add warmth.' },
    'mutfak:bastan-tasarim':  { head: 'Olive kitchen with breakfast bar', text: 'Olive base cabinets, built-in appliances and open shelves with warm lighting. A wooden breakfast bar with terracotta stools replaces the dining table; the window stays.' },
    'yatak:hafif-tazeleme':   { head: 'Soft, layered bedroom', text: 'A green throw, pink and green cushions, a bench and a striped rug. New curtains, an abstract canvas and warm lamps; the bed stays.' },
    'yatak:yenileme':         { head: 'Warm ochre bedroom', text: 'A wooden bed with an ochre headboard, a knit throw and mustard cushions. Taupe curtains, a wall sconce, a globe pendant and an ochre canvas.' },
    'yatak:bastan-tasarim':   { head: 'Navy and oak bedroom', text: 'An oak slat feature wall, a navy built-in wardrobe and navy cushions. A reading chair, a black pendant and a blue striped rug complete the room.' },
  };
  const CREDITS = 24; // demoda sabit: satın alma akışı yok, sayı yalnız görünür
  const KEY = 'vesira-web-demo-v1';

  const seed = () => ({
    rooms: [
      { id: 'r1', key: 'salon', name: 'Living room', versions: ['hafif-tazeleme', 'yenileme'], date: 'October 29' },
      { id: 'r2', key: 'koridor', name: 'Hallway', versions: ['yenileme'],                   date: 'October 30' },
      { id: 'r3', key: 'mutfak', name: 'Kitchen', versions: ['bastan-tasarim'],             date: 'October 30' },
    ],
    learned: ['Colors you like: Warm earth tones. We\'ll suggest this first in the wizard.', 'You said it was too crowded; we now favor a simpler, airier layout.'],
    profileOn: true, choices: 3, n: 3,
  });
  /* localStorage'dan okunan her alan doğrulanır (oda anahtarı, seviye kimliği, sayılar, metinler); bozuk/elle değiştirilmiş veri atılır. */
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const clean = (raw) => {
    if (!raw || !Array.isArray(raw.rooms)) return null;
    const lvIds = LEVELS.map((l) => l.id);
    const rooms = raw.rooms.slice(0, 40).map((r, i) => ({
      id: 'r' + (Number.isFinite(Number(String(r && r.id).slice(1))) ? Number(String(r.id).slice(1)) : i + 1),
      key: r && ROOMS[r.key] ? r.key : null,
      name: esc(String((r && r.name) || (r && ROOMS[r.key] && ROOMS[r.key].name) || '').slice(0, 40)),
      versions: Array.isArray(r && r.versions) ? r.versions.filter((v) => lvIds.includes(v)).slice(0, 50) : [],
      date: esc(String((r && r.date) || '').slice(0, 24)),
    })).filter((r) => r.key && r.versions.length);
    return {
      rooms,
      learned: Array.isArray(raw.learned) ? raw.learned.slice(0, 6).map((t) => esc(String(t).slice(0, 160))) : [],
      profileOn: raw.profileOn !== false,
      choices: Math.max(0, Math.min(999, Number(raw.choices) || 0)),
      n: Math.max(rooms.length, Math.min(9999, Number(raw.n) || rooms.length)),
    };
  };
  let P; try { P = clean(JSON.parse(localStorage.getItem(KEY) || 'null')); } catch (_) { P = null; }
  if (!P) P = seed();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (_) { /* gizli sekme */ } };

  const S = { tab: 'home', screen: 'home', draft: { room: null, level: 'yenileme', touched: false, color: 'auto', note: '' }, err: '', open: { roomId: null, ver: 0 }, liked: null, refine: new Set(), own: '' };

  const $ = (s, r = document) => r.querySelector(s);
  const app = $('#app'), view = $('#view'), layers = $('#layers'), tabs = $('#tabs'), toastEl = $('#toast');
  const reduce = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (window.self !== window.top) document.body.classList.add('framed');

  /* ── Simgeler ── */
  const IC = {
    logo: '<svg viewBox="0 0 64 64"><defs><linearGradient id="vg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a63f22"/><stop offset=".55" stop-color="#c85d34"/><stop offset="1" stop-color="#e19a54"/></linearGradient></defs><path d="M14 56V26a18 18 0 0 1 36 0v30z" fill="url(#vg)"/><path d="M24 56V27a8 8 0 0 1 16 0v29z" fill="#f6f2ea"/></svg>',
    home: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 3 10.5V20a1 1 0 0 0 1 1h5v-6h6v6h5a1 1 0 0 0 1-1v-9.5z"/></svg>',
    grid: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>',
    spark: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 3l1.8 5.2L17 10l-5.2 1.8L10 17l-1.8-5.2L3 10l5.2-1.8z"/><path d="M18 14l.9 2.1L21 17l-2.1.9L18 20l-.9-2.1L15 17l2.1-.9z"/></svg>',
    gear: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-1.7-1L15 3.4h-4l-.4 2.6a7.6 7.6 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.6 7.6 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.6 7.6 0 0 0 1.7-1l2.4 1 2-3.4zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>',
    back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
    x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    plus: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    cmp: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7l-5 5 5 5M15 7l5 5-5 5"/></svg>',
    check: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3L13 4.5"/></svg>',
    up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 11v9H4v-9zM7 11l4-8c1.5 0 2.5 1 2.5 2.5V9H19a2 2 0 0 1 2 2.3l-1.2 7A2 2 0 0 1 17.8 20H7"/></svg>',
    down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="transform:scaleY(-1)"><path d="M7 11v9H4v-9zM7 11l4-8c1.5 0 2.5 1 2.5 2.5V9H19a2 2 0 0 1 2 2.3l-1.2 7A2 2 0 0 1 17.8 20H7"/></svg>',
    dots: '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>',
  };
  const img = (key, v, size, alt, extra = '') => { const r = ROOMS[key]; const a = size === 'l' ? [r.w, r.h] : null; return `<img src="odalar/${key}-${v}-${size}.webp" ${a ? `width="${a[0]}" height="${a[1]}"` : ''} alt="${alt}" decoding="async" style="object-position:${r.op}" ${extra}>`; };
  const roomOf = (id) => P.rooms.find((r) => r.id === id);
  const today = () => new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric' });
  const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

  let toastT; const toast = (m) => { toastEl.textContent = m; toastEl.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('on'), 2200); };

  /* ── Önce/sonra kaydırıcı ── */
  const slider = (key, level, id, label) => {
    const r = ROOMS[key];
    return `<div class="ba" data-ba style="aspect-ratio:${r.w} / ${r.h}">
      ${img(key, level, 'l', 'After: redesigned room, sample image', 'class="after"')}
      ${img(key, 'once', 'l', 'Before: original room, sample image', 'class="before"')}
      <span class="line"></span><span class="knob" aria-hidden="true">${IC.cmp}</span>
      <span class="tg l">before</span><span class="tg r">after</span>
      <input type="range" min="0" max="100" value="50" id="${id}" aria-label="${label}">
    </div>`;
  };
  const crossfade = (key, level, id, label) => {
    const r = ROOMS[key];
    return `<div class="ba xf" data-xf data-s="after" style="aspect-ratio:${r.w} / ${r.h}">
      ${img(key, level, 'l', 'After: redesigned room, sample image', 'class="after"')}
      ${img(key, 'once', 'l', 'Before: original room, sample image', 'class="before"')}
      <div class="xf-seg" role="group" aria-label="${label}"><button type="button" data-xfs="before" aria-pressed="false" id="${id}-b">before</button><button type="button" data-xfs="after" aria-pressed="true" id="${id}-a">after</button></div>
    </div>`;
  };
  const compare = (key, level, id, label) => (aligned(key, level) ? slider(key, level, id, label) : crossfade(key, level, id, label));
  const wireSliders = (root) => root.querySelectorAll('[data-ba]').forEach((ba) => { const i = $('input', ba); const set = () => ba.style.setProperty('--p', i.value + '%'); i.addEventListener('input', set); set(); });

  /* ── Sekmeler ── */
  const TABS = [['home', 'Home', IC.home], ['rooms', 'My rooms', IC.grid], ['credits', 'Credits', IC.spark], ['settings', 'Settings', IC.gear]];
  const renderTabs = () => {
    const active = S.screen === 'result' || S.screen === 'rooms' ? 'rooms' : S.screen === 'settings' ? 'settings' : 'home';
    tabs.innerHTML = TABS.map(([id, label, ic]) => `<button type="button" data-tab="${id}" ${id === active ? 'aria-current="page"' : ''}>${ic}${label}</button>`).join('');
  };

  /* ── Ekranlar ── */
  const screens = {
    home() {
      const date = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }).toUpperCase();
      const versions = P.rooms.reduce((n, r) => n + r.versions.length, 0);
      const cov = Math.max(1, Math.round(CREDITS / 4)); // 24 kredi / Full redesign 4 kredi = 6
      return `<section class="scr">
        <div style="display:flex;justify-content:space-between;align-items:center"><span class="eyebrow">${date}</span><span class="credit-chip">${CREDITS} credits</span></div>
        <h1 class="h-big" style="margin-top:26px">Good morning<span class="dot">.</span></h1>
        <p class="sub">Pick up where you left off, or add a new room.</p>
        <div style="display:grid;gap:10px;margin-top:20px">
          <button type="button" class="btn primary" data-act="new">${IC.plus} Add a new room</button>
          <button type="button" class="btn ghost" data-act="rooms">Go to my rooms</button>
        </div>
        <div class="stats3">
          <div class="card stat"><div class="k">Rooms</div><div class="v">${P.rooms.length}</div><div class="u">${P.rooms.length === 1 ? 'project' : 'projects'}</div></div>
          <div class="card stat"><div class="k">Versions</div><div class="v">${versions}</div><div class="u">saved</div></div>
          <div class="card stat"><div class="k">Credits</div><div class="v">${CREDITS}</div><div class="u">left</div></div>
        </div>
        <div class="card credits-card">
          <div class="top"><h3>Your credits</h3><button type="button" class="lnk" data-act="na">Credits</button></div>
          <div class="big">${CREDITS}<small>credits left</small></div>
          <div class="bar"><i></i></div>
          <div class="legend"><span>Left<b>${CREDITS}</b></span><span>Used<b>0</b></span></div>
          <div class="arches" aria-hidden="true">${'<i></i>'.repeat(cov)}</div>
          <p class="note">Your remaining credits cover about <b>${plural(cov, 'room')}</b>. There's no room limit.</p>
        </div>
      </section>`;
    },
    rooms() {
      if (!P.rooms.length) return `<section class="scr"><div class="rooms-h"><h1>Your rooms</h1><button type="button" class="btn primary" data-act="new">${IC.plus} New room</button></div><p class="empty">No rooms yet. Send a photo and your first room will show up here.</p></section>`;
      const [first, ...rest] = P.rooms;
      const meta = (r) => `${plural(r.versions.length, 'version')} · ${r.date}`;
      const cover = (r) => r.versions[r.versions.length - 1];
      return `<section class="scr">
        <div class="rooms-h"><h1>Your rooms</h1><button type="button" class="btn primary" data-act="new">${IC.plus} New room</button></div>
        <button type="button" class="room-big" data-open="${first.id}"><div class="im" style="aspect-ratio:${ROOMS[first.key].big}">${img(first.key, cover(first), 'l', `${first.name}, sample image`)}</div><div class="t"><h3>${first.name}</h3><span class="m">${meta(first)}</span></div></button>
        ${rest.length ? `<div class="grid2">${rest.map((r) => `<button type="button" class="room-sm" data-open="${r.id}"><div class="im">${img(r.key, cover(r), 'l', `${r.name}, sample image`, 'loading="lazy"')}</div><h3>${r.name}</h3><span class="m">${meta(r)}</span></button>`).join('')}</div>` : ''}
      </section>`;
    },
    settings() {
      const on = P.profileOn;
      return `<section class="scr"><h1 class="rooms-h" style="font-family:var(--serif);font-weight:500;font-size:36px;letter-spacing:-.02em;display:block">Settings</h1>
        <div class="card prof" style="margin-top:18px">
          <div class="hd"><h3>Your design profile</h3><button type="button" class="toggle" role="switch" aria-checked="${on}" aria-label="Design profile" data-act="prof-toggle"></button></div>
          <h4>What we've learned from you</h4>
          ${P.learned.length ? `<ul>${P.learned.map((t) => `<li>${t}</li>`).join('')}</ul>` : '<p class="muted" style="font-size:14px">Nothing clear yet; this fills in as you give feedback on results.</p>'}
          <div class="ft"><span>Based on ${plural(P.choices, 'choice')} and pieces of feedback</span><button type="button" data-act="prof-reset">Reset</button></div>
          <p class="priv">Kept only in your account and never used to train models.</p>
        </div></section>`;
    },
    result() {
      const r = roomOf(S.open.roomId); if (!r) return screens.rooms();
      const v = Math.min(S.open.ver, r.versions.length - 1), level = r.versions[v], L = lv(level), R = ROOMS[r.key];
      const sum = SUMMARY[`${r.key}:${level}`];
      return `<section class="scr" style="padding-top:6px">
        <div class="topbar"><button type="button" class="circle" data-act="rooms" aria-label="Back to my rooms">${IC.back}</button><div class="logo">${IC.logo}Vesira</div><span class="credit-chip">${CREDITS} credits</span></div>
        <div style="display:flex;justify-content:space-between;align-items:flex-start"><h1 class="res-title">${r.name}</h1><button type="button" class="menu-dots" data-act="na" aria-label="More">${IC.dots}</button></div>
        <p class="res-meta">Version ${v + 1} · ${L.name}</p>
        ${r.versions.length > 1 ? `<div class="tabs" role="tablist">${r.versions.map((_, i) => `<button type="button" role="tab" data-ver="${i}" aria-selected="${i === v}">Version ${i + 1}</button>`).join('')}</div>` : '<div style="height:14px"></div>'}
        <div class="sum"><h2>${sum.head}</h2>${sum.text.split(/(?<=\.)\s+/).map((t) => `<p>${t}</p>`).join('')}</div>
        <p class="limit">The window position can't be changed in a photo.</p>
        ${compare(r.key, level, 'ba-main', 'Before and after comparison')}
        <button type="button" class="cmp" data-act="full">Compare full screen</button>
        <div class="acts">
          <button type="button" class="btn primary" data-act="another">Another idea · ${plural(L.cost, 'credit')}</button>
          <div class="two"><button type="button" class="btn ghost" data-act="refine">Refine</button><button type="button" class="btn ghost" aria-disabled="true" data-act="download" title="Not available in the demo">Download</button></div>
        </div>
        <div class="rate"><button type="button" aria-label="Like" aria-pressed="${S.liked === 'up'}" data-rate="up">${IC.up}</button><button type="button" aria-label="Dislike" aria-pressed="${S.liked === 'down'}" data-rate="down">${IC.down}</button>${S.liked === 'up' ? '<span class="msg">Noted. We\'ll tune your next request to it.</span>' : ''}</div>
      </section>`;
    },
    designing() {
      const r = ROOMS[S.draft.room];
      return `<section class="scr" style="padding:6px 0 0"><div class="topbar" style="padding-inline:18px"><span></span><div class="logo">${IC.logo}Vesira</div><span class="credit-chip">${CREDITS} credits</span></div>
        <div class="designing" style="aspect-ratio:${r.w} / ${r.h}">${img(S.draft.room, 'once', 'l', 'Your room photo, sample image')}<div class="veil"></div></div>
        <div class="dtxt"><em>Designing</em>Takes 1–2 minutes. You can leave this page.<div class="prog" aria-hidden="true"><i></i></div></div></section>`;
    },
  };
  const nextLevel = (r) => { const order = LEVELS.map((l) => l.id); const last = r.versions[r.versions.length - 1]; return order[(order.indexOf(last) + 1) % order.length]; };

  const render = () => {
    view.innerHTML = screens[S.screen]();
    wireSliders(view); renderTabs();
    view.scrollTop = 0;
    $('#tabs').hidden = S.screen === 'designing';
  };
  const go = (screen) => { S.screen = screen; closeLayers(); render(); };

  /* ── Katmanlar (sheet) ── */
  const closeLayers = () => { layers.innerHTML = ''; };
  const levelsHTML = () => { const k = S.draft.room || 'salon'; return LEVELS.map((l) => `<button type="button" class="level" role="radio" aria-checked="${S.draft.level === l.id}" data-level="${l.id}">${img(k, 'once', 't', `${ROOMS[k].name}, sample photo`)}<h3>${l.name}</h3>${ROOMS[k].def === l.id ? '<span class="rec">recommended</span>' : ''}<p>${l.desc}</p><b>${plural(l.cost, 'credit')}</b></button>`).join(''); };
  const newRoomSheet = () => {
    const d = S.draft, cost = lv(d.level).cost;
    layers.innerHTML = `<div class="backdrop" data-act="close"></div><div class="layer dim" role="dialog" aria-modal="true" aria-label="New room"><div class="grab"></div>
      <div class="body" id="nr-body">
        <div class="topbar" style="grid-template-columns:40px 1fr auto"><button type="button" class="circle" data-act="close" aria-label="Back to my rooms">${IC.x}</button><div class="logo">${IC.logo}Vesira</div><span class="credit-chip">${CREDITS} credits</span></div>
        <div class="step"><i>1</i><h2>Photo of your room</h2></div>
        <p class="help">Sample photos for this demo. Pick one.</p>
        <div class="rooms-pick" role="radiogroup" aria-label="Sample rooms">${Object.entries(ROOMS).map(([k, r]) => `<button type="button" class="pick" role="radio" aria-checked="${d.room === k}" data-room="${k}">${img(k, 'once', 't', `${r.name}, sample photo`)}<span>${r.name}</span></button>`).join('')}</div>
        <p class="err" id="nr-err" role="alert" ${S.err ? '' : 'hidden'}>${S.err}</p>
        <div class="step"><i>2</i><h2>How much should change?</h2></div>
        <div class="levels" role="radiogroup" aria-label="How much should change?" id="nr-levels">${levelsHTML()}</div>
        <div class="step"><i>3</i><h2>Color theme<small>optional</small></h2></div>
        <div class="chips" id="nr-chips">${CHIPS.map((c) => `<button type="button" class="chip" aria-pressed="${d.color === c.id}" data-chip="${c.id}">${c.sw ? `<span class="sw" aria-hidden="true">${c.sw.map((x) => `<i style="background:${x}"></i>`).join('')}</span>` : ''}${c.name}</button>`).join('')}</div>
        <div class="step"><i>4</i><h2>Your note<small>optional</small></h2></div>
        <label for="nr-note" class="sr" style="position:absolute;left:-9999px">Your note</label>
        <textarea class="note" id="nr-note" placeholder="E.g. keep the bookcase and armchair, add green tones, make it feel like an Aegean stone house" maxlength="300">${d.note.replace(/</g, '&lt;')}</textarea>
      </div>
      <div class="foot"><button type="button" class="btn primary" id="nr-go" data-act="design">Design · <span id="nr-cost">${plural(cost, 'credit')}</span></button><p class="fine">Takes 1–2 minutes. If no image is created, your credits are refunded.</p></div></div>`;
    $('.layer .circle').focus({ preventScroll: true });
  };
  const refineSheet = () => {
    const r = roomOf(S.open.roomId); const v = Math.min(S.open.ver, r.versions.length - 1);
    const row = (t) => `<button type="button" class="row-opt" data-ref="${t}" aria-pressed="${S.refine.has(t)}" ${!S.refine.has(t) && S.refine.size >= 5 ? 'disabled' : ''}><span>${t}</span><span class="o">${IC.check}</span></button>`;
    layers.innerHTML = `<div class="backdrop" data-act="close"></div><div class="layer dim" role="dialog" aria-modal="true" aria-label="Refine"><div class="grab"></div>
      <div class="body"><div class="ref-top"><div><h2 class="ref-h">What should change?</h2><p class="ref-sub">Based on version ${v + 1}. Up to 5 choices; the earlier version is kept.</p></div><button type="button" class="circle" data-act="close" aria-label="Close">${IC.x}</button></div>
        <div style="margin-top:14px;border-top:1px solid var(--line)">${REF_MAIN.map(row).join('')}</div>
        <p class="grp">Other refinements</p><div style="border-top:1px solid var(--line)">${REF_OTHER.map(row).join('')}</div>
        <p class="own-l">Or write your own</p><label for="own" style="position:absolute;left:-9999px">Or write your own</label><input class="own" id="own" placeholder="E.g. make the sofa dark green" maxlength="120" value="${S.own.replace(/"/g, '&quot;')}">
      </div>
      <div class="foot"><button type="button" class="btn primary" id="ref-go" data-act="refine-go" ${S.refine.size || S.own ? '' : 'aria-disabled="true"'}>Create new version · 1 credit</button><p class="fine">Your old version is kept.</p></div></div>`;
    $('.layer .circle').focus({ preventScroll: true });
  };
  const fullScreen = () => {
    const r = roomOf(S.open.roomId); const level = r.versions[Math.min(S.open.ver, r.versions.length - 1)];
    layers.innerHTML = `<div class="full" role="dialog" aria-modal="true" aria-label="Compare full screen"><button type="button" class="x" data-act="close">Close</button>${compare(r.key, level, 'ba-full', 'Before and after comparison, full screen')}</div>`;
    wireSliders(layers); $('.full .x').focus({ preventScroll: true });
  };

  /* ── Üretim akışı (sahte bekleme 2–3 sn) ── */
  let busy = false;
  const addVersion = (r, level) => { r.versions.push(level); S.open = { roomId: r.id, ver: r.versions.length - 1 }; P.choices += 1; save(); };
  const fake = (done) => { if (busy) return; busy = true; closeLayers(); S.screen = 'designing'; render(); setTimeout(() => { busy = false; done(); }, reduce() ? 900 : 2600); };

  document.addEventListener('click', (e) => {
    const t = e.target.closest('button, [data-act]'); if (!t) return;
    if (t.id === 'reset') { P = seed(); save(); Object.assign(S, { draft: { room: null, level: 'yenileme', touched: false, color: 'auto', note: '' }, err: '', liked: null, refine: new Set(), own: '' }); busy = false; go('home'); toast('Demo reset'); return; }
    if (t.dataset.tab) { const id = t.dataset.tab; if (id === 'credits') return toast('Not available in the demo'); go(id === 'rooms' ? 'rooms' : id === 'settings' ? 'settings' : 'home'); return; }
    if (t.dataset.open) { S.open = { roomId: t.dataset.open, ver: roomOf(t.dataset.open).versions.length - 1 }; S.liked = null; go('result'); return; }
    if (t.dataset.ver) { S.open.ver = +t.dataset.ver; S.liked = null; render(); return; }
    if (t.dataset.room) { S.draft.room = t.dataset.room; if (!S.draft.touched) S.draft.level = ROOMS[t.dataset.room].def; S.err = ''; $('#nr-err').hidden = true; layers.querySelectorAll('[data-room]').forEach((b) => b.setAttribute('aria-checked', String(b === t))); $('#nr-levels').innerHTML = levelsHTML(); $('#nr-cost').textContent = plural(lv(S.draft.level).cost, 'credit'); return; }
    if (t.dataset.level) { S.draft.level = t.dataset.level; S.draft.touched = true; layers.querySelectorAll('[data-level]').forEach((b) => b.setAttribute('aria-checked', String(b === t))); $('#nr-cost').textContent = plural(lv(S.draft.level).cost, 'credit'); return; }
    if (t.dataset.chip) { S.draft.color = t.dataset.chip; layers.querySelectorAll('[data-chip]').forEach((b) => b.setAttribute('aria-pressed', String(b === t))); return; }
    if (t.dataset.ref) { const x = t.dataset.ref; if (S.refine.has(x)) S.refine.delete(x); else if (S.refine.size < 5) S.refine.add(x); const y = $('.layer .body').scrollTop; refineSheet(); $('.layer .body').scrollTop = y; return; }
    if (t.dataset.xfs) { const box = t.closest('[data-xf]'); box.setAttribute('data-s', t.dataset.xfs); box.querySelectorAll('[data-xfs]').forEach((b) => b.setAttribute('aria-pressed', String(b === t))); return; }
    if (t.dataset.rate) { const v = t.dataset.rate; S.liked = S.liked === v ? null : v; if (S.liked) { P.choices += 1; save(); } render(); return; }
    switch (t.dataset.act) {
      case 'new': S.draft = { room: null, level: 'yenileme', touched: false, color: 'auto', note: '' }; S.err = ''; newRoomSheet(); break;
      case 'rooms': go('rooms'); break;
      case 'close': closeLayers(); break;
      case 'na': toast('Not available in the demo'); break;
      case 'download': toast('Not available in the demo'); break;
      case 'full': fullScreen(); break;
      case 'refine': S.refine = new Set(); S.own = ''; refineSheet(); break;
      case 'prof-toggle': P.profileOn = !P.profileOn; save(); render(); break;
      case 'prof-reset': P.learned = []; P.choices = 0; save(); render(); break;
      case 'design': {
        const d = S.draft; d.note = ($('#nr-note') || {}).value || '';
        if (!d.room) { S.err = 'Add a photo of your room first.'; const el = $('#nr-err'); el.textContent = S.err; el.hidden = false; $('#nr-body').scrollTo({ top: 0 }); return; }
        const btn = $('#nr-go'); btn.textContent = 'Preparing'; btn.setAttribute('aria-disabled', 'true');
        setTimeout(() => fake(() => {
          const id = 'r' + (++P.n); const same = P.rooms.filter((x) => x.key === d.room).length; P.rooms.unshift({ id, key: d.room, name: same ? `${ROOMS[d.room].name} ${same + 1}` : ROOMS[d.room].name, versions: [d.level], date: today() }); P.choices += 1; save();
          S.open = { roomId: id, ver: 0 }; S.liked = null; go('result');
        }), reduce() ? 0 : 450);
        break;
      }
      case 'another': { const r = roomOf(S.open.roomId); fake(() => { addVersion(r, nextLevel(r)); S.liked = null; go('result'); }); break; }
      case 'refine-go': { if (t.getAttribute('aria-disabled') === 'true') return; const r = roomOf(S.open.roomId); fake(() => { addVersion(r, nextLevel(r)); S.liked = null; go('result'); }); break; }
      default:
    }
  });
  document.addEventListener('input', (e) => {
    if (e.target.id === 'own') { S.own = e.target.value; const b = $('#ref-go'); if (b) { if (S.refine.size || S.own) b.removeAttribute('aria-disabled'); else b.setAttribute('aria-disabled', 'true'); } }
    if (e.target.id === 'nr-note') S.draft.note = e.target.value;
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && layers.firstChild) closeLayers(); });
  render();
})();
</script>
</body>
</html>
