<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CarLog web demosu — CizgiFikrim</title>
  <meta name="description" content="CarLog iOS uygulamasının örnek verilerle çalışan web demosu.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F4F6FB">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="app.css?v=2">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
</head>
<body>
  <div class="app" id="app">
    <div class="statusbar" aria-hidden="true">
      <span class="clock" data-clock>09:41</span>
      <span class="demo-chip">WEB DEMO</span>
      <span class="icons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5" width="3" height="7" rx="1"/><rect x="10" y="2.5" width="3" height="9.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x=".5" y=".5" width="22" height="11" rx="3.5" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="17" height="8" rx="2" fill="#34C759"/><rect x="24" y="4" width="1.5" height="4" rx=".75" fill="currentColor" opacity=".4"/></svg>
      </span>
    </div>
    <header class="navbar" data-navbar></header>
    <main class="screen" id="screen" aria-live="polite"></main>
    <nav class="tabbar" aria-label="Sekmeler">
      <button type="button" data-tab="summary" class="on">
        <svg width="26" height="22" viewBox="0 0 26 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2v18h22"/><path d="M6 15l5-6 4 4 7-8"/></svg>Özet</button>
      <button type="button" data-tab="live">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 12l4-4"/><path d="M6 12h1M17 12h1M12 6v1M8 8l.6.6"/></svg>Canlı Sürüş</button>
      <button type="button" data-tab="garage">
        <svg width="30" height="22" viewBox="0 0 30 22" fill="currentColor"><path d="M6 8l2.4-5A3 3 0 0 1 11.1 1h7.8a3 3 0 0 1 2.7 2L24 8a3 3 0 0 1 3 3v6a2 2 0 0 1-2 2h-1a3 3 0 0 1-6 0h-6a3 3 0 0 1-6 0H5a2 2 0 0 1-2-2v-6a3 3 0 0 1 3-3zm3.3-.2h11.4l-1.7-3.7a1 1 0 0 0-.9-.6h-6.2a1 1 0 0 0-.9.6z"/></svg>Garajım</button>
    </nav>
    <div class="sheet-wrap" data-sheet-wrap>
      <section class="sheet" role="dialog" aria-modal="true" data-sheet>
        <div class="sheet-bar"><button type="button" class="pill-btn" data-close>Kapat</button><h2 data-sheet-title></h2><span></span></div>
        <div class="screen" data-sheet-body></div>
      </section>
    </div>
    <div class="toast" role="status" data-toast></div>
  </div>
  <script src="app.js?v=1"></script>
</body>
</html>
